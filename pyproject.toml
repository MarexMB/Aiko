[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "aiko-desktop"
version = "0.1.0"
description = "A local-first desktop companion powered by Ollama"
requires-python = ">=3.11,<3.15"
dependencies = ["PySide6>=6.8.3,<6.13", "httpx>=0.28.1,<0.29"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
aiko = "aiko.app:main"

[tool.setuptools.packages.find]
include = ["aiko*"]

[tool.setuptools.package-data]
"aiko.characters" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
